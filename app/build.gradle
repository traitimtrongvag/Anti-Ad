plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def localSigning = new Properties()
def localSigningFile = rootProject.file('key.properties')
if (localSigningFile.isFile()) {
    localSigningFile.withInputStream { localSigning.load(it) }
}
def releaseSigning = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH') ?: localSigning.getProperty('storeFile'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: localSigning.getProperty('storePassword'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS') ?: localSigning.getProperty('keyAlias'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD') ?: localSigning.getProperty('keyPassword')
]
def hasReleaseSigning = releaseSigning.values().every { it }

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.AntiAD"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "v0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    namespace 'com.AntiAD'

    lint {
        checkDependencies true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation("androidx.concurrent:concurrent-futures-ktx:1.1.0")
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
